services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: agentai
      POSTGRES_USER: agentai
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a PostgreSQL password}"
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentai -d agentai"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.16.2
    volumes: ["qdrant:/qdrant/storage"]
  ocr:
    build: ./services/ocr
    init: true
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 1g
    cpus: 2
    pids_limit: 64
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    volumes: ["documents:/app/data"]
    environment:
      DOCUMENTS_DIR: /app/data/documents
      DATABASE_URL: "postgresql://agentai:${POSTGRES_PASSWORD:?Set a PostgreSQL password}@postgres:5432/agentai"
      RETRIEVAL_CACHE_ENTRIES: "${RETRIEVAL_CACHE_ENTRIES:-4}"
      RETRIEVAL_CACHE_TTL_SECONDS: "${RETRIEVAL_CACHE_TTL_SECONDS:-30}"
      QUERY_EMBED_CACHE_ENTRIES: "${QUERY_EMBED_CACHE_ENTRIES:-64}"
      QUERY_EMBED_CACHE_TTL_SECONDS: "${QUERY_EMBED_CACHE_TTL_SECONDS:-300}"
      RAG_CHUNK_CHARS: "${RAG_CHUNK_CHARS:-3500}"
      RAG_CHUNK_OVERLAP: "${RAG_CHUNK_OVERLAP:-400}"
      RAG_CHUNK_LINES: "${RAG_CHUNK_LINES:-50}"
      RAG_CANDIDATES: "${RAG_CANDIDATES:-20}"
      RAG_TOP_K: "${RAG_TOP_K:-6}"
      RAG_CONTEXT_CHARS: "${RAG_CONTEXT_CHARS:-12000}"
      OCR_URL: "${OCR_URL-http://ocr:8000}"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      ocr:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
  chat:
    build: ./web/chat
    ports: ["127.0.0.1:3000:3000"]
    environment:
      AGENTAI_URL: http://api:8000
    init: true
    depends_on: [api]
    restart: unless-stopped
  webui:
    profiles: ["legacy-webui"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: open-webui:local
    ports: ["127.0.0.1:3001:8080"]
    volumes: ["webui:/app/backend/data"]
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      OPENAI_API_BASE_URL: http://api:8000/v1
      OPENAI_API_KEY: "${WEBUI_READER_KEY:?Set a dedicated reader key}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?Set a random secret}"
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "true"
    depends_on: [api]
volumes:
  postgres:
  documents:
  qdrant:
  webui:
