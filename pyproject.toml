[project]
name = "agentai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langchain>=1,<2", "langchain-openai>=1,<2", "langgraph>=1,<2", "qdrant-client>=1.15,<2", "httpx>=0.28,<1", "pypdf>=5,<7", "python-docx>=1.1,<2", "rank-bm25>=0.2.2,<1", "PyYAML>=6,<7", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
sql = ["pyodbc>=5,<6"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
